[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-grpo"
version = "0.2.0"
description = "Evidence-grounded state atlas and state-conditioned context GRPO"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.8,<2.9", "transformers>=4.57,<5", "peft>=0.17,<0.18", "safetensors>=0.4"]
test = ["pytest>=8"]

[project.scripts]
scope = "scope.cli:main"

[tool.setuptools.packages.find]
include = ["scope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

